name: correspondence

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18+: каталог данных версионируется внутри /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  # Файловое хранилище вложений: SeaweedFS (master + volume + filer + S3-шлюз в одном процессе).
  # Ключи доступа S3 берутся из .env и записываются в конфигурацию identities при старте контейнера.
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"backend","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -filer -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # веб-интерфейс filer (просмотр файлов)
    healthcheck:
      # master готов + S3-шлюз принимает соединения
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && (wget -q -O /dev/null http://127.0.0.1:8333/healthz || nc -z 127.0.0.1 8333)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

  backend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "correspondence", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  # --- по запросу: docker compose --profile test run --rm tests ---
  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # --- по запросу: rclone для резервного копирования файлов (scripts/backup_storage.sh) ---
  rclone:
    image: rclone/rclone:${RCLONE_VERSION:-latest}
    profiles: ["tools"]
    environment:
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: SeaweedFS
      RCLONE_CONFIG_SRC_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./backups:/backups:z   # :z — метка SELinux (AlmaLinux)
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
